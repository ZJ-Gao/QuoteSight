<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22305E"/>
      <stop offset="1" stop-color="#14707F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F3F6"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#FFA21F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#06131F" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- page, centered -->
  <rect x="232" y="232" width="560" height="560" rx="44" fill="url(#paper)" filter="url(#shadow)"/>

  <!-- opening quote mark (left) and sparkle (right) share one top row -->
  <text x="290" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="700" fill="#22305E">“</text>
  <path transform="translate(700 316)" d="M0 -48 C5 -14 14 -5 48 0 C14 5 5 14 0 48 C-5 14 -14 5 -48 0 C-14 -5 -5 -14 0 -48 Z" fill="#FFA21F"/>

  <!-- text lines: one left edge, 60 px rhythm -->
  <rect x="296" y="420" width="432" height="26" rx="13" fill="#CDD4DC"/>
  <rect x="276" y="466" width="472" height="64" rx="18" fill="url(#marker)"/>
  <rect x="296" y="485" width="432" height="26" rx="13" fill="#5A3400"/>
  <rect x="296" y="550" width="432" height="26" rx="13" fill="#CDD4DC"/>
  <rect x="296" y="610" width="432" height="26" rx="13" fill="#CDD4DC"/>
  <rect x="296" y="670" width="300" height="26" rx="13" fill="#CDD4DC"/>
</svg>
